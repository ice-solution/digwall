<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Wall — 提交訊息</title>
  <style>
    :root {
      --page-bg: #dff3ff;
      --text: #2b2b2b;
      --blue: #0b4fc2;
      --btn: #1b8fc6;
      --btn-hover: #1679a8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text);
      font-family: Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    .page { max-width: 420px; margin: 0 auto; padding: 24px 20px 40px; }
    .field { position: relative; margin-bottom: 28px; }
    /* 錯誤訊息絕對定位喺輸入框下面嘅空位，唔會推走下面嘅內容 */
    .field-error {
      position: absolute;
      left: 0;
      top: 100%;
      margin: 3px 0 0;
      font-size: 13px;
      line-height: 1.3;
      color: #c0262d;
    }
    .input.invalid { outline: 2px solid #c0262d; outline-offset: 0; }
    .label { display: block; font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .hint { font-size: 14px; font-weight: 400; color: #5b6b78; }
    .input {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      border: 0;
      border-radius: 0;
      background: #fff;
      font-size: 18px;
      color: var(--text);
    }
    .input:focus { outline: 3px solid var(--blue); outline-offset: 0; }

    .picker { display: flex; align-items: center; justify-content: space-between; }
    .picker .label { margin: 0; }
    .picker-ctrl { display: flex; align-items: center; gap: 14px; }
    .arrow {
      width: 40px;
      height: 44px;
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
    }
    .arrow:focus-visible { outline: 3px solid var(--blue); }
    .value {
      min-width: 36px;
      text-align: center;
      font-size: 40px;
      font-weight: 700;
      color: var(--blue);
    }

    /* 預覽：1920x1080 座標，同 Unity prefab 一致 */
    .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; margin: 8px 0 32px; }
    .stage img, .pv-name { position: absolute; }
    #pv-bg { inset: 0; width: 100%; height: 100%; }
    #pv-msg { object-fit: fill; }
    .pv-name {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
      font-weight: 700;
      line-height: 1;
      color: #0b2aa5;
      overflow-wrap: anywhere;
      width: 17.969%;
      height: 9.259%;
      font-size: calc(40 * var(--u, 0.2px));
    }
    /* Message1 prefab */
    .stage[data-style="0"] #pv-msg { left: 43.698%; top: 41.574%; width: 40%; height: 40%; }
    .stage[data-style="0"] .pv-name { left: 65.078%; top: 33.519%; }
    /* Message2 prefab */
    .stage[data-style="1"] #pv-msg { left: 27.344%; top: 48.796%; width: 30%; height: 30%; }
    .stage[data-style="1"] .pv-name { left: 22.786%; top: 37.963%; }

    .submit {
      width: 100%;
      height: 52px;
      border: 0;
      background: var(--btn);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    .submit:hover:not(:disabled) { background: var(--btn-hover); }
    .submit:disabled { opacity: 0.6; cursor: default; }
    .status { min-height: 1.4em; margin: 14px 0 0; text-align: center; font-size: 15px; }
    .status.ok { color: #0a7a3d; }
    .status.err { color: #c0262d; }

    .save-panel { margin-top: 20px; }
    .save-panel[hidden] { display: none !important; }
    .save-notice { margin: 0 0 14px; text-align: center; line-height: 1.5; }
    .save-notice strong { display: block; font-size: 18px; color: var(--blue); margin-bottom: 4px; }
    .save-notice span { display: block; font-size: 14px; color: #334155; }
    #save-preview {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
      -webkit-touch-callout: default;
      -webkit-user-select: auto;
      user-select: auto;
    }
    .save-hint {
      margin: 12px 0 0;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      color: #334155;
    }
    .save-hint:empty { display: none; }
    .save-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .save-done { background: #64748b; }
    .save-done:hover:not(:disabled) { background: #475569; }
  </style>
</head>
<body>
  <main class="page">
    <form id="submit-form" novalidate>
      <div class="field">
        <label class="label" for="name">姓名 Name <span class="hint">(e.g. David Chan)</span></label>
        <input id="name" class="input" type="text" maxlength="80" autocomplete="name" aria-describedby="name-error" />
        <p class="field-error" id="name-error" role="alert"></p>
      </div>

      <div class="field">
        <label class="label" for="agent-code">Agent Code <span class="hint">(e.g. 0123456)</span></label>
        <input id="agent-code" class="input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="7" autocomplete="off" aria-describedby="agent-error" />
        <p class="field-error" id="agent-error" role="alert"></p>
      </div>

      <div class="field picker">
        <span class="label" id="style-label">背景 Background</span>
        <div class="picker-ctrl" role="group" aria-labelledby="style-label">
          <button type="button" class="arrow" data-target="style" data-step="-1" aria-label="上一個背景">&lt;</button>
          <span class="value" id="style-value" aria-live="polite">1</span>
          <button type="button" class="arrow" data-target="style" data-step="1" aria-label="下一個背景">&gt;</button>
        </div>
      </div>

      <div class="field picker">
        <span class="label" id="message-label">目標 Target</span>
        <div class="picker-ctrl" role="group" aria-labelledby="message-label">
          <button type="button" class="arrow" data-target="message" data-step="-1" aria-label="上一個目標">&lt;</button>
          <span class="value" id="message-value" aria-live="polite">1</span>
          <button type="button" class="arrow" data-target="message" data-step="1" aria-label="下一個目標">&gt;</button>
        </div>
      </div>

      <div class="stage" id="stage" data-style="0" aria-label="預覽 Preview">
        <img id="pv-bg" alt="" />
        <img id="pv-msg" alt="" />
        <div class="pv-name" id="pv-name"><span id="pv-name-text"></span></div>
      </div>

      <button type="submit" id="submit-btn" class="submit">提交 Submit</button>
      <p id="status" class="status" role="status"></p>
    </form>

    <section id="save-panel" class="save-panel" hidden>
      <p class="save-notice">
        <strong>請儲存此圖片到你的裝置</strong>
        <span>Please save this image to your device</span>
      </p>
      <img id="save-preview" alt="Composed message" />
      <p id="save-hint" class="save-hint"></p>
      <div class="save-actions">
        <button type="button" id="save-btn" class="submit">下載圖片 Download JPG</button>
        <button type="button" id="save-done" class="submit save-done">完成 Done</button>
      </div>
    </section>
  </main>

  <script>
    const STYLE_COUNT = 2;
    const MESSAGE_COUNT = 5;
    const NAME_MAX_SIZE = 40;
    const NAME_MIN_SIZE = 20;

    const state = { style: 0, message: 0 };

    const form = document.getElementById('submit-form');
    const nameInput = document.getElementById('name');
    const agentInput = document.getElementById('agent-code');
    const nameError = document.getElementById('name-error');
    const agentError = document.getElementById('agent-error');
    const stage = document.getElementById('stage');
    const pvBg = document.getElementById('pv-bg');
    const pvMsg = document.getElementById('pv-msg');
    const pvName = document.getElementById('pv-name');
    const pvNameText = document.getElementById('pv-name-text');
    const styleValue = document.getElementById('style-value');
    const messageValue = document.getElementById('message-value');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submit-btn');
    const savePanel = document.getElementById('save-panel');
    const savePreview = document.getElementById('save-preview');
    const saveHint = document.getElementById('save-hint');
    const saveBtn = document.getElementById('save-btn');
    const saveDone = document.getElementById('save-done');
    let saveUrl = '';
    let saveFile = null;

    // 預覽用：畫面第 n 個 Message 對應嘅圖檔（msg_N.webp = Msg_N.png）
    // 畫面 1:Msg_4、2:Msg_3、3:Msg_5、4:Msg_1、5:Msg_2
    // Unity 嘅 spriteMsgs 已經跟呢個次序排，所以 msg_id = 畫面第 n 個 - 1
    const MESSAGE_ORDER = [3, 2, 4, 0, 1];

    const bgSrc = (i) => `img/bg_${i + 1}.webp`;
    const msgSrc = (i) => `img/msg_${MESSAGE_ORDER[i] + 1}.webp`;

    // 同 CSS / Unity prefab 百分比座標（基準 1920x1080）
    const LAYOUTS = {
      0: {
        msg: { left: 0.43698, top: 0.41574, width: 0.4, height: 0.4 },
        name: { left: 0.65078, top: 0.33519, width: 0.17969, height: 0.09259 },
      },
      1: {
        msg: { left: 0.27344, top: 0.48796, width: 0.3, height: 0.3 },
        name: { left: 0.22786, top: 0.37963, width: 0.17969, height: 0.09259 },
      },
    };
    // 輸出跟素材原生解像度（而家 webp 係 960x540）；拉上 1920 會模糊
    const DESIGN_W = 1920;
    const DESIGN_H = 1080;

    // 先載入所有圖，切換時唔會閃
    for (let i = 0; i < STYLE_COUNT; i++) new Image().src = bgSrc(i);
    for (let i = 0; i < MESSAGE_COUNT; i++) new Image().src = msgSrc(i);

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('圖片載入失敗'));
        img.src = src;
      });
    }

    function wrapCanvasText(ctx, text, maxWidth) {
      const lines = [];
      let line = '';
      for (const ch of text) {
        const test = line + ch;
        if (line && ctx.measureText(test).width > maxWidth) {
          lines.push(line);
          line = ch;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      return lines.length ? lines : [''];
    }

    function drawName(ctx, name, box, canvasW, canvasH) {
      const scale = canvasW / DESIGN_W;
      const x = box.left * canvasW;
      const y = box.top * canvasH;
      const w = box.width * canvasW;
      const h = box.height * canvasH;
      const maxSize = Math.round(NAME_MAX_SIZE * scale);
      const minSize = Math.max(8, Math.round(NAME_MIN_SIZE * scale));
      ctx.fillStyle = '#0b2aa5';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let size = maxSize; size >= minSize; size -= 1) {
        ctx.font = `700 ${size}px Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif`;
        const lines = wrapCanvasText(ctx, name, w);
        const lineHeight = size * 1.05;
        const totalH = lines.length * lineHeight;
        if (totalH <= h && lines.every((ln) => ctx.measureText(ln).width <= w)) {
          const startY = y + (h - totalH) / 2 + lineHeight / 2;
          lines.forEach((ln, i) => {
            ctx.fillText(ln, x + w / 2, startY + i * lineHeight);
          });
          return;
        }
      }

      ctx.font = `700 ${minSize}px Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif`;
      const lines = wrapCanvasText(ctx, name, w);
      const lineHeight = minSize * 1.05;
      const startY = y + (h - lines.length * lineHeight) / 2 + lineHeight / 2;
      lines.forEach((ln, i) => {
        ctx.fillText(ln, x + w / 2, startY + i * lineHeight);
      });
    }

    async function composeJpeg(name, style, message) {
      const layout = LAYOUTS[style] || LAYOUTS[0];
      const [bg, msg] = await Promise.all([
        loadImage(bgSrc(style)),
        loadImage(msgSrc(message)),
      ]);

      // 用背景圖原生解像度，避免 upscale 變朦
      const canvasW = bg.naturalWidth || 960;
      const canvasH = bg.naturalHeight || 540;
      const canvas = document.createElement('canvas');
      canvas.width = canvasW;
      canvas.height = canvasH;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.fillStyle = '#dff3ff';
      ctx.fillRect(0, 0, canvasW, canvasH);
      ctx.drawImage(bg, 0, 0, canvasW, canvasH);
      ctx.drawImage(
        msg,
        layout.msg.left * canvasW,
        layout.msg.top * canvasH,
        layout.msg.width * canvasW,
        layout.msg.height * canvasH
      );
      if (name) drawName(ctx, name, layout.name, canvasW, canvasH);
      // 1.0 = 最高 JPEG 質素；文字邊緣仍清晰啲
      return canvasToJpegBlob(canvas);
    }

    function canvasToJpegBlob(canvas) {
      return new Promise((resolve, reject) => {
        let settled = false;
        const finish = (blob, err) => {
          if (settled) return;
          settled = true;
          if (blob) resolve(blob);
          else reject(err || new Error('圖片產生失敗'));
        };
        const fromDataUrl = () => {
          try {
            const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
            fetch(dataUrl).then((r) => r.blob()).then((blob) => finish(blob)).catch((err) => finish(null, err));
          } catch (err) {
            finish(null, err);
          }
        };
        // 部分 iPhone 上 toBlob 唔會 callback，逾時就改用 toDataURL
        const timer = setTimeout(fromDataUrl, 3000);
        try {
          canvas.toBlob((blob) => {
            clearTimeout(timer);
            if (blob) finish(blob);
            else fromDataUrl();
          }, 'image/jpeg', 1.0);
        } catch (err) {
          clearTimeout(timer);
          fromDataUrl();
        }
      });
    }

    // iPhone Safari 唔支援 <a download> 配 data: / blob:，撳落去完全冇反應。
    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    function canShareFile(file) {
      try {
        return !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
      } catch (err) {
        return false;
      }
    }

    function showLongPressHint() {
      saveHint.textContent = '請長按上方圖片，然後選擇「儲存影像」 / Long-press the image, then tap Save Image.';
      saveBtn.textContent = '請長按上方圖片';
    }

    function showSavePanel(blob, fileName) {
      const nextUrl = URL.createObjectURL(blob);
      const prevUrl = saveUrl;
      saveFile = new File([blob], fileName, { type: 'image/jpeg' });
      saveUrl = nextUrl;
      savePreview.src = nextUrl;
      if (prevUrl) URL.revokeObjectURL(prevUrl);
      const ios = isIOS();
      saveBtn.textContent = ios ? '儲存圖片 Save Image' : '下載圖片 Download JPG';
      saveHint.textContent = ios
        ? '請按「儲存圖片」，在分享選單選擇「儲存影像」。亦可長按圖片再選「儲存影像」。 / Tap Save Image, then choose Save Image. Or long-press the picture.'
        : '';
      savePanel.hidden = false;
      savePanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function clearSavePanel() {
      savePanel.hidden = true;
      savePreview.removeAttribute('src');
      saveHint.textContent = '';
      saveFile = null;
      if (saveUrl) {
        URL.revokeObjectURL(saveUrl);
        saveUrl = '';
      }
    }

    saveBtn.addEventListener('click', () => {
      if (!saveFile || !saveUrl) return;
      if (isIOS()) {
        if (canShareFile(saveFile)) {
          // iOS 如果同時傳 title 同 files，分享會直接失敗
          navigator.share({ files: [saveFile] }).catch((err) => {
            if (!err || err.name === 'AbortError') return;
            showLongPressHint();
          });
          return;
        }
        showLongPressHint();
        return;
      }
      const a = document.createElement('a');
      a.href = saveUrl;
      a.download = saveFile.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    saveDone.addEventListener('click', clearSavePanel);

    // 同 Unity Text 嘅 Best Fit 類似：由大到細揀到放得落個框
    function fitName() {
      const unit = stage.clientWidth / 1920;
      stage.style.setProperty('--u', `${unit}px`);
      let size = NAME_MAX_SIZE;
      pvName.style.fontSize = `${size * unit}px`;
      while (size > NAME_MIN_SIZE && pvNameText.offsetHeight > pvName.clientHeight) {
        size -= 1;
        pvName.style.fontSize = `${size * unit}px`;
      }
    }

    function render() {
      stage.dataset.style = String(state.style);
      pvBg.src = bgSrc(state.style);
      pvMsg.src = msgSrc(state.message);
      styleValue.textContent = String(state.style + 1);
      messageValue.textContent = String(state.message + 1);
      pvNameText.textContent = nameInput.value.trim();
      fitName();
    }

    function step(target, delta) {
      const count = target === 'style' ? STYLE_COUNT : MESSAGE_COUNT;
      state[target] = (state[target] + delta + count) % count;
      render();
    }

    document.querySelectorAll('.arrow').forEach((el) => {
      el.addEventListener('click', () => step(el.dataset.target, Number(el.dataset.step)));
    });
    function setFieldError(input, errorEl, message) {
      errorEl.textContent = message;
      input.classList.toggle('invalid', Boolean(message));
      input.setAttribute('aria-invalid', message ? 'true' : 'false');
    }

    nameInput.addEventListener('input', () => {
      setFieldError(nameInput, nameError, '');
      render();
    });
    // Agent Code 只收數字（唔會顯示喺預覽）
    agentInput.addEventListener('input', () => {
      agentInput.value = agentInput.value.replace(/\D/g, '').slice(0, 7);
      setFieldError(agentInput, agentError, '');
    });
    new ResizeObserver(fitName).observe(stage);

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = `status ${kind || ''}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const agentCode = agentInput.value.trim();

      // 兩個欄位一齊檢查，錯誤各自顯示喺自己嘅輸入框下面
      const nameMessage = name ? '' : '請輸入姓名';
      const agentMessage = /^\d{5,7}$/.test(agentCode) ? '' : 'Agent Code 要係 5-7 個數字';
      setFieldError(nameInput, nameError, nameMessage);
      setFieldError(agentInput, agentError, agentMessage);
      if (nameMessage || agentMessage) {
        setStatus('');
        (nameMessage ? nameInput : agentInput).focus();
        return;
      }

      btn.disabled = true;
      setStatus('提交中…');

      // Unity 用 0 起始 index：sticker_id 0 = Prefab[0]，msg_id 0 = Sprite[0]
      const body = {
        name,
        sticker_id: String(state.style),
        msg_id: String(state.message),
        optional_id: agentCode,
      };
      const styleAtSubmit = state.style;
      const messageAtSubmit = state.message;

      try {
        const res = await fetch('/api/messages/slot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || '提交失敗');

        const jpeg = await composeJpeg(name, styleAtSubmit, messageAtSubmit);
        const fileName = `digital-wall-${agentCode || 'message'}.jpg`.replace(/[^\w.-]+/g, '_');
        showSavePanel(jpeg, fileName);

        setStatus('提交成功！請儲存下方圖片 / Submitted! Please save the image below.', 'ok');
        nameInput.value = '';
        agentInput.value = '';
        setFieldError(nameInput, nameError, '');
        setFieldError(agentInput, agentError, '');
        render();
      } catch (err) {
        setStatus(err.message || '提交失敗', 'err');
      } finally {
        btn.disabled = false;
      }
    });

    render();
  </script>
</body>
</html>
