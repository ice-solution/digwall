# Digital Wall — digwall.ice-solution.hk
# Cloudflare SSL: Flexible (visitor WSS → CF → origin WS over HTTP :80)
#
# Required (缺 proxy_wstunnel → /ws 回 HTML 500):
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers remoteip rewrite
#   sudo apache2ctl -M | grep proxy_wstunnel
#
# Cloudflare → Network → WebSockets = ON
#
# Backend port 必須與 .env PORT 一致（而家係 5799）

<VirtualHost *:80>
    ServerName digwall.ice-solution.hk
    ServerAdmin admin@ice-solution.hk

    ErrorLog ${APACHE_LOG_DIR}/digwall.error.log
    CustomLog ${APACHE_LOG_DIR}/digwall.access.log combined

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 86400

    RequestHeader set X-Forwarded-Proto "https" env=HTTP_CF_VISITOR
    RequestHeader setifempty X-Forwarded-Proto "https"

    RewriteEngine On

    # WebSocket: Upgrade 請求經 wstunnel 轉去 Node
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*)  ws://127.0.0.1:5799/$1  [P,L]

    # 一般 HTTP（非 Upgrade）
    ProxyPass        /  http://127.0.0.1:5799/
    ProxyPassReverse /  http://127.0.0.1:5799/
</VirtualHost>
