# Digital Wall — digwall.ice-solution.hk
# Cloudflare SSL mode: Flexible (visitor→CF = HTTPS, CF→origin = HTTP :80)
#
# Enable modules:
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers remoteip rewrite
#
# Install:
#   sudo cp deploy/apache2/cloudflare-remoteip.conf /etc/apache2/conf-available/
#   sudo a2enconf cloudflare-remoteip
#   sudo cp deploy/apache2/digwall.ice-solution.hk.conf /etc/apache2/sites-available/
#   sudo a2ensite digwall.ice-solution.hk
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName digwall.ice-solution.hk
    ServerAdmin admin@ice-solution.hk

    # Do NOT force HTTPS redirect on origin under Flexible —
    # Cloudflare already terminates TLS; origin only receives HTTP.

    ErrorLog ${APACHE_LOG_DIR}/digwall.error.log
    CustomLog ${APACHE_LOG_DIR}/digwall.access.log combined

    ProxyPreserveHost On
    ProxyRequests Off

    # Cloudflare Flexible: visitors use HTTPS; pass scheme to Express
    RequestHeader set X-Forwarded-Proto "https" env=HTTP_CF_VISITOR
    RequestHeader setifempty X-Forwarded-Proto "https"

    # WebSocket → Node
    ProxyPass        /ws  ws://127.0.0.1:5799/ws
    ProxyPassReverse /ws  ws://127.0.0.1:5799/ws

    # HTTP API + static pages → Node
    ProxyPass        /    http://127.0.0.1:5799/
    ProxyPassReverse /    http://127.0.0.1:5799/

    # Long-lived WS connections
    ProxyTimeout 86400
</VirtualHost>
