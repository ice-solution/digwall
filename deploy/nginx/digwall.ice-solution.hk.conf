# Digital Wall — digwall.ice-solution.hk
# Cloudflare SSL mode: Flexible (visitor→CF = HTTPS, CF→origin = HTTP :80)
#
# Install:
#   sudo cp deploy/nginx/cloudflare-realip.conf /etc/nginx/conf.d/cloudflare-realip.conf
#   sudo cp deploy/nginx/digwall.ice-solution.hk.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/digwall.ice-solution.hk.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream digital_wall_app {
    server 127.0.0.1:5799;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name digwall.ice-solution.hk;

    # Do NOT force HTTPS redirect on origin under Flexible —
    # Cloudflare already terminates TLS; origin only receives HTTP.

    include /etc/nginx/conf.d/cloudflare-realip.conf;

    access_log /var/log/nginx/digwall.access.log;
    error_log  /var/log/nginx/digwall.error.log;

    client_max_body_size 1m;

    # WebSocket
    location /ws {
        proxy_pass http://digital_wall_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API + static pages
    location / {
        proxy_pass http://digital_wall_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare Flexible still sends X-Forwarded-Proto: https to origin
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
